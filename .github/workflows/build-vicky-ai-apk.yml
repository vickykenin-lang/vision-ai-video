name: Build Vicky AI APK

on:
  push:
    branches:
      - build/vicky-ai-android-v1
    paths:
      - 'vicky-ai-android/**'
      - '.github/workflows/build-vicky-ai-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vicky-ai-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vicky-ai-v1-apk
          path: vicky-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
